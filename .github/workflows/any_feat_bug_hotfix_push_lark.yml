name: Lark notify on feat/bug/hotfix push

on:
  push:
    branches:
      - dev
      - main
      - "feature/**"
      - "feat/**"
      - "dev_project/**"
      - "main_project/**"
      - "bug/**"
      - "hotfix/**"

jobs:
  notify:
    # Skip PR merge commits / merge commits
    if: |
      github.event.head_commit != null &&
      !startsWith(github.event.head_commit.message, 'Merge pull request') &&
      !startsWith(github.event.head_commit.message, 'Merge branch')

    runs-on: ubuntu-latest

    steps:
      - name: Build message
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const repo = `${context.repo.owner}/${context.repo.repo}`
            const branch = context.ref.replace('refs/heads/', '')
            const head = context.payload.head_commit

            if (!head) {
              core.setOutput("should_notify", "false")
              console.log("Skip: no head_commit in payload")
              return
            }

            const title = `【Github】Checkout Skill Push to ${branch}`
            const msg = (head.message || "").trim()

            // keep it short to avoid huge cards
            const shortMsg = msg.length > 500 ? msg.slice(0, 500) + "…" : msg

            const bodyLines = [
              `Repo: ${repo}`,
              `Branch: ${branch}`,
              `Pusher: ${context.actor}`,
              `Commit: ${head.id?.slice(0, 7)}`,
              `URL: ${head.url}`,
              "",
              `Message:`,
              shortMsg
            ]

            core.setOutput("should_notify", "true")
            core.setOutput("title", title)
            core.setOutput("body", bodyLines.join("\n"))
            core.setOutput("url", head.url)

      - name: Send Lark message
        if: steps.build.outputs.should_notify == 'true'
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          TITLE: ${{ steps.build.outputs.title }}
          BODY: ${{ steps.build.outputs.body }}
          URL: ${{ steps.build.outputs.url }}
        run: |
          set -euo pipefail

          payload="$(jq -n \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            --arg url "$URL" \
            '{
              msg_type: "interactive",
              card: {
                schema: "2.0",
                config: { wide_screen_mode: true },
                header: {
                  template: "purple",
                  title: { tag: "plain_text", content: $title }
                },
                body: {
                  elements: [
                    { tag: "markdown", content: ("```text\n" + $body + "\n```") },
                    {
                      tag: "button",
                      text: { tag: "plain_text", content: "Open Commit" },
                      type: "primary",
                      url: $url
                    }
                  ]
                }
              }
            }'
          )"

          curl -sS -X POST "$LARK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"